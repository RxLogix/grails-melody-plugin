buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://repo.grails.org/grails/restricted" }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"
        classpath "cloud.wondrify:asset-pipeline-gradle:5.0.34"
    }
}

apply plugin: "groovy"
apply plugin: "eclipse"
apply plugin: "idea"
apply plugin: "war"
apply plugin: "org.apache.grails.gradle.grails-web"
apply plugin: "org.apache.grails.gradle.grails-gsp"
apply plugin: "cloud.wondrify.asset-pipeline"
apply plugin: "application"

version "0.1"
group "app.integration.tests"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://repo.grails.org/grails/restricted" }
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")

    // Standard Grails 7 web-application stack (replaces the removed grails-dependencies aggregate
    // and the individual grails-plugin-* modules from Grails 6).
    implementation "org.apache.grails:grails-dependencies-starter-web"
    implementation "org.apache.grails:grails-data-hibernate5"
    implementation "org.apache.grails:grails-gsp"
    implementation "org.apache.grails.views:grails-web-gsp"
    implementation "org.apache.grails.views:grails-web-gsp-taglib"

    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.springframework.boot:spring-boot-starter-validation"

    console "org.apache.grails:grails-console"
    profile "org.apache.grails.profiles:web"

    assets "org.apache.grails:grails-dependencies-assets"

    runtimeOnly "com.h2database:h2"
    runtimeOnly "org.apache.tomcat:tomcat-jdbc"
    runtimeOnly "org.fusesource.jansi:jansi"

    testImplementation "org.apache.grails.testing:grails-testing-support-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.spockframework:spock-core"
    // Spock mock engine for concrete classes (transitive in Grails 6, explicit in 7)
    testImplementation "net.bytebuddy:byte-buddy"
    testRuntimeOnly    "net.bytebuddy:byte-buddy-agent"

    implementation "net.bull.javamelody:javamelody-core:${versionDependency}"
    implementation project(':grails-melody-plugin')
}

application {
    mainClass.set("app.integration.tests.Application")
}

compileJava.options.release = 17

// https://github.com/apache/grails-core/issues/15321
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = false
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

bootRun {
    ignoreExitValue true
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-XX:TieredStopAtLevel=1',
            '-Xmx1024m')
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

assets {
    minifyJs = true
    minifyCss = true
}