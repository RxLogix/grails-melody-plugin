buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://repo.grails.org/grails/restricted" }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"
        classpath "com.gorylenko.gradle-git-properties:gradle-git-properties:4.0.1"
    }
}

apply plugin: "groovy"
apply plugin: "eclipse"
apply plugin: "idea"
apply plugin: "org.apache.grails.gradle.grails-plugin"
apply plugin: "com.gorylenko.gradle-git-properties"
apply plugin: "maven-publish"

group "org.grails.plugins"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://repo.grails.org/grails/restricted" }
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

dependencies {
    // Version alignment across all Grails/Spring modules
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")

    developmentOnly("org.springframework.boot:spring-boot-devtools")
    // Framework APIs are provided by the host Grails application at runtime -> compileOnly.
    compileOnly "org.apache.grails:grails-core"
    compileOnly "org.apache.grails:grails-web-boot"
    compileOnly "org.apache.grails:grails-data-hibernate5"
    compileOnly "org.springframework.boot:spring-boot-autoconfigure"
    compileOnly "org.springframework.boot:spring-boot-starter-logging"

    // Servlet API is supplied by the container (embedded Tomcat) at runtime -> compileOnly.
    compileOnly "jakarta.servlet:jakarta.servlet-api:${jakartaServletApiVersion}"
    implementation "net.bull.javamelody:javamelody-core:${versionDependency}"

    // compileOnly deps are not on the test classpath, so re-declare what the specs touch.
    testImplementation "org.spockframework:spock-core"
    // Spock mock engine for concrete classes (transitive in Grails 6, explicit in 7).
    testImplementation "net.bytebuddy:byte-buddy"
    testRuntimeOnly    "net.bytebuddy:byte-buddy-agent"
    testImplementation "org.apache.grails:grails-core"
    testImplementation "org.springframework.boot:spring-boot-autoconfigure"
    testImplementation "jakarta.servlet:jakarta.servlet-api:${jakartaServletApiVersion}"
}

// Grails 7.0.x: disable Groovy invokedynamic optimization (see apache/grails-core#15321)
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = false
}

compileJava.options.release = 17

tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}

gitProperties {
    keys = ['git.branch', 'git.commit.id', 'git.commit.time', 'git.commit.id.abbrev']
    failOnNoGitDirectory = true
    extProperty = 'gitProps' // git properties will be put in a map at project.ext.gitProps
}

generateGitProperties.outputs.upToDateWhen {
    false
} // make sure the generateGitProperties task always executes (even when git.properties is not changed)

jar {
    dependsOn generateGitProperties
    manifest {
        attributes("Built-By": System.getProperty("user.name"))
        attributes(["Plugin-Version"        : version,
                    "Plugin-Title"          : project.name,
                    "Plugin-Build-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "Git-Commit"            : "${-> project.ext.gitProps['git.commit.id.abbrev']}",
                    "Git-Branch"            : "${-> project.ext.gitProps['git.branch']}"])
    }
    from sourceSets.main.output
    exclude 'git.properties'
}

tasks.register('sourceJar', Jar) {
    dependsOn generateGitProperties
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

tasks.register('packageJavadoc', Jar) {
    archiveClassifier = 'javadoc'
    from javadoc
}

tasks.register('packageGroovydoc', Jar) {
    archiveClassifier = 'groovydoc'
    from groovydoc
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
// enable if you wish to package this plugin as a standalone application
bootJar.enabled = false

publishing {
    publications {
        mavenJar(MavenPublication) {
            from components.java
            artifact sourceJar
            artifact packageJavadoc
            artifact packageGroovydoc
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/RxLogix/grails-melody-plugin")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
        maven {
            name = "NexusRepo"
            credentials {
                username project.findProperty("nexusUsername") ?: System.getenv("NEXUS_USERNAME")
                password project.findProperty("nexusPassword") ?: System.getenv("NEXUS_PASSWORD")
            }
            url project.findProperty("nexusUrl") ?: System.getenv("NEXUS_URL")
            allowInsecureProtocol = project.findProperty("isNexusUrlInsecure") ? true : false
        }
    }
}